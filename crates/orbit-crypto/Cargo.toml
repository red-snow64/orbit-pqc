[package]
name = "orbit-crypto"
version = "0.1.0"
edition = "2021"
authors = ["Orbit Core Team"]
description = "FIPS 203/204 Post-Quantum Cryptography and Stateful Seed Engine"

[dependencies]
pqcrypto-mlkem = "0.1.1"
pqcrypto-mldsa = "0.1.2"
pqcrypto-traits = "0.3"
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
zeroize = { version = "1.7", features = ["zeroize_derive", "alloc"] }
subtle = "2.5"
thiserror = "1.0"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
parking_lot = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Memory"] }